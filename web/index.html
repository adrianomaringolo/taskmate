<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Taskmate</title>
    <meta name="description" content="Controle de tarefas com grupos, listas e atividades." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0f12" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Same checkbox-and-tick as the sidebar mark and the app icons. The old
         three-bar glyph read as a hamburger menu at this size. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%23cc7d2a' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='2' y='2' width='12' height='12' rx='3.6'/%3E%3Cpath d='M5 8.2l2.2 2.2L11.2 5.8'/%3E%3C/svg%3E"
    />
    <script>
      // Applies the saved theme before first paint so there is no flash of the
      // wrong theme on load. Kept inline and tiny for exactly that reason.
      try {
        var t = localStorage.getItem('taskmate:theme') || localStorage.getItem('trellis:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
