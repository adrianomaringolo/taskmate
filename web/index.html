<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Taskmate</title>
    <meta name="description" content="Controle de tarefas com grupos, listas e atividades." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0f12" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The "rising check": same brand mark as the sidebar and the app icons —
         a check whose long arm carries up into a ray, with a detached dash just
         ahead of the tip. Slightly heavier stroke than the in-app icon so the
         thin strokes survive at favicon size. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%23cc7d2a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M3.4 10.4 5.5 12.7 11.6 4.6'/%3E%3Cpath d='M12.9 2.9 13.9 1.6'/%3E%3C/svg%3E"
    />
    <script>
      // Applies the saved theme before first paint so there is no flash of the
      // wrong theme on load. Kept inline and tiny for exactly that reason.
      try {
        var t = localStorage.getItem('taskmate:theme') || localStorage.getItem('trellis:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
