<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Capturar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1350px; overflow: hidden; background: #ffffff; font-family: 'Inter', system-ui, sans-serif; color: #161a1f; -webkit-font-smoothing: antialiased; }
.slide { position: relative; width: 1080px; height: 1350px; padding: 96px 88px; overflow: hidden; background: #ffffff; }
.corner { position: absolute; top: 88px; left: 88px; display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 600; color: #6b7178; }
.eyebrow { font-size: 28px; font-weight: 600; color: #a15f27; margin-bottom: 22px; }
h1 { font-size: 76px; font-weight: 650; line-height: 1.06; letter-spacing: -0.032em; text-wrap: balance; max-width: 15ch; }
.lede { margin-top: 30px; max-width: 30ch; font-size: 34px; line-height: 1.45; color: #4d535a; text-wrap: pretty; }
.copy { position: absolute; top: 200px; left: 88px; right: 88px; }
.floor { position: absolute; left: 0; right: 0; bottom: 0; background: #f5f7fa; border-top: 1px solid #dde0e4; }
.stage { position: absolute; left: 88px; right: 88px; }
.progress { position: absolute; left: 0; right: 0; bottom: 60px; display: flex; justify-content: center; gap: 10px; z-index: 5; }
.progress span { width: 16px; height: 6px; border-radius: 3px; background: #dde0e4; }
.progress span.active { width: 40px; background: #cd8134; }
/* app vocabulary, at ~2.2x */
.card { background: #ffffff; border: 1px solid #dde0e4; border-radius: 22px; padding: 28px 32px; box-shadow: 0 12px 32px rgba(22,26,31,.08), 0 2px 6px rgba(22,26,31,.05); }
.view-head { display: flex; align-items: center; gap: 14px; font-size: 28px; font-weight: 600; color: #4d535a; padding-bottom: 18px; border-bottom: 1px solid #dde0e4; }
.view-head .ic { color: #6b7178; }
.view-head .count { margin-left: auto; font-variant-numeric: tabular-nums; color: #6b7178; font-weight: 500; }
.view-head--late { color: #c51d28; } .view-head--late .ic { color: #c51d28; }
.tasks { list-style: none; }
.task { display: flex; gap: 22px; align-items: flex-start; padding: 22px 4px; border-bottom: 1px solid #dde0e4; }
.task:last-child { border-bottom: 0; }
.check { flex: none; display: grid; place-items: center; width: 36px; height: 36px; margin-top: 2px; border: 2px solid #c9ccd1; border-radius: 9px; background: #fff; color: #25170b; }
.check.on { background: #cd8134; border-color: #cd8134; }
.check .ic { width: 24px; height: 24px; stroke-width: 3; }
.task__title { font-size: 31px; line-height: 1.3; }
.task.done .task__title { color: #6b7178; text-decoration: line-through; text-decoration-color: #9aa0a6; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; margin-top: 8px; font-size: 25px; color: #6b7178; font-variant-numeric: tabular-nums; }
.meta .today { color: #a15f27; font-weight: 550; }
.meta .late { display: inline-flex; align-items: center; gap: 8px; color: #c51d28; font-weight: 550; }
.meta .where { display: inline-flex; align-items: center; gap: 10px; }
.dot { width: 14px; height: 14px; border-radius: 50%; }
.prio { display: inline-flex; align-items: flex-end; gap: 8px; font-weight: 550; }
.prio__bars { display: inline-flex; align-items: flex-end; gap: 3px; height: 20px; }
.prio__bars i { width: 5px; border-radius: 1.5px; background: currentColor; }
.prio--3 { color: #c51d28; } .prio--2 { color: #a15f27; }
.snooze { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 14px; font-size: 24px; color: #6b7178; }
.snooze b { font-weight: 500; margin-right: 4px; }
.snooze span { padding: 4px 14px; border: 1.5px solid #c9ccd1; border-radius: 9px; color: #161a1f; font-weight: 500; }
.snooze span.picked { border-color: #cd8134; background: rgba(205,129,52,.12); color: #7d4816; }

kbd { display: inline-block; min-width: 44px; padding: 0 12px; border: 1.5px solid #c9ccd1; border-bottom-width: 4px; border-radius: 10px; background: #fff; font: 600 28px/1.5 'Inter', sans-serif; color: #4d535a; text-align: center; vertical-align: 3px; }
.field { display: flex; align-items: center; gap: 20px; padding: 30px 32px; background: #fff; border: 2px solid #cd8134; border-radius: 22px; font-size: 38px; box-shadow: 0 0 0 8px rgba(205,129,52,.14), 0 12px 32px rgba(22,26,31,.08); }
.field .plus { display: grid; color: #a15f27; }
.field mark { background: rgba(205,129,52,.16); color: #7d4816; border-radius: 8px; padding: 0 6px; font-weight: 550; }
.caret { width: 3px; height: 44px; background: #161a1f; margin-left: -12px; }
.parsed { margin: 26px 8px 40px; font-size: 27px; color: #6b7178; }
.parsed b { color: #161a1f; font-weight: 600; }
.result { padding-block: 10px; }
</style>
</head>
<body>
<div class="slide">

<div class="corner"><svg class="mark" width="30" height="30" viewBox="0 0 16 16" fill="none" stroke="#cd8134" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.4 10.4 5.5 12.7 10.8 5.7" /><path d="M12.9 2.9 13.9 1.6" /></svg><span>Taskmate</span></div>
<div class="copy">
  <p class="eyebrow">Capturar</p>
  <h1>Anote em cinco segundos.</h1>
  <p class="lede">A tecla <kbd>N</kbd> abre a captura em qualquer tela. Prazo e prioridade saem do próprio texto.</p>
</div>
<div class="floor" style="top:820px"></div>
<div class="stage" style="top:760px">
  <div class="field"><span class="plus"><svg class="ic" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14" /><path d="M12 5v14" /></svg></span><span>Pagar a luz <mark>amanhã</mark> <mark>!alta</mark></span><span class="caret"></span></div>
  <p class="parsed">Entendido: prazo <b>amanhã</b>, prioridade <b>alta</b>.</p>
  <div class="card result">
    <ul class="tasks"><li class="task"><span class="check"></span><div><div class="task__title">Pagar a luz</div><div class="meta"><span>amanhã</span><span class="prio prio--3"><span class="prio__bars"><i style="height:11px;opacity:1"></i><i style="height:16px;opacity:1"></i><i style="height:21px;opacity:1"></i></span>Alta</span></div></div></li></ul>
  </div>
</div>

<div class="progress"><span></span><span></span><span class="active"></span><span></span><span></span><span></span><span></span></div>
</div>
</body>
</html>
